<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Presentations — ONDA Nile</title>
<style>
  :root {
    --teal: #009688;
    --teal-dark: #007a70;
    --teal-light: #E8F8F6;
    --ink: #1a1a1a;
    --body: #333;
    --muted: #666;
    --border: #CCC;
    --bg: #F7F9F9;
    --surface: #FFF;
    --error: #c0392b;
    --success: #1a7f4b;
    --success-bg: #eafaf1;
    --warn: #B45A00;
    --warn-bg: #FEF3E6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.6; padding: 0 0 80px;
  }
  header { background: var(--teal); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .wordmark { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .03em; }
  .header-sub { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 1px; }
  header a { color: rgba(255,255,255,.8); font-size: 13px; text-decoration: none; margin-left: auto; }
  header a:hover { color: #fff; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 0; }
  .banner { padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 16px; display: none; }
  .banner.error { background: #fdecea; color: var(--error); display: block; }

  .page-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  .p-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 16px; overflow: hidden;
  }
  .p-header { padding: 16px 20px 12px; }
  .p-title-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .p-title { font-size: 16px; font-weight: 700; color: var(--ink); flex: 1; min-width: 160px; }
  .p-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-pill {
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    background: #f0f0f0; color: var(--muted);
  }
  .status-pill.published { background: var(--success-bg); color: var(--success); }
  .status-pill.pending, .status-pill.submitted { background: var(--warn-bg); color: var(--warn); }

  .p-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px 0; }
  .p-tag {
    font-size: 11px; font-weight: 600; padding: 3px 9px;
    background: var(--teal-light); color: var(--teal); border-radius: 20px;
    border: 2px solid var(--teal);
  }
  .p-tag.hidden-tag { background: #f0f0f0; color: var(--muted); border-color: #ddd; text-decoration: line-through; }

  .p-synopsis { padding: 12px 20px 0; font-size: 14px; color: var(--body); }

  .p-approvals { padding: 14px 20px 16px; border-top: 1px solid #f0f0f0; margin-top: 12px; }
  .p-approvals-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .p-approve-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .p-approve-row:last-child { margin-bottom: 0; }
  .p-approve-pill {
    font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
    cursor: pointer; border: 2px solid var(--border); background: transparent; color: var(--muted);
    font-family: inherit;
  }
  .p-approve-pill.active { border-color: var(--success); color: var(--success); background: var(--success-bg); }
  .p-curator-note { font-size: 12px; color: var(--muted); }
  .p-curator-note.approved { color: var(--success); font-weight: 600; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">ONDA Nile · My Presentations</div>
    <div class="header-sub">Your own submissions, across every station</div>
  </div>
  <a href="#" id="back-link">← Hub</a>
</header>

<div class="wrap">
  <div id="banner" class="banner"></div>
  <div class="page-title">My Archive</div>
  <div class="page-sub">A curator generates a draft and approves it for their side — nothing goes further than a station, or out onto Nile, until you approve that same level too.</div>
  <div id="list"></div>
</div>

<script>
const NILE_API = 'https://xrxm-29on-xlyt.n7e.xano.io/api:onda-nile';

const params = new URLSearchParams(location.search);
const PHONE = params.get('phone');
const TOKEN = params.get('token');

let myTiles = [];

function showBanner(msg) {
  const el = document.getElementById('banner');
  el.className = 'banner error';
  el.textContent = msg;
}

if (!PHONE || !TOKEN) {
  showBanner('Missing phone or token — go back to the hub and sign in again.');
} else {
  document.getElementById('back-link').href = `../nile-admin/login.html?phone=${encodeURIComponent(PHONE)}&token=${encodeURIComponent(TOKEN)}`;
  loadMine();
}

async function loadMine() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty-state"><span class="spinner"></span> Loading…</div>';
  try {
    const r = await fetch(`${NILE_API}/nile/presenter/my-presentations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: PHONE, magic_auth_token: TOKEN }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.message || 'Could not load your presentations.');
    }
    myTiles = await r.json();
    render();
  } catch (e) {
    showBanner(e.message);
    list.innerHTML = '';
  }
}

function render() {
  const list = document.getElementById('list');
  if (!myTiles.length) {
    list.innerHTML = '<div class="empty-state">Nothing submitted yet.</div>';
    return;
  }
  list.innerHTML = myTiles.map(t => {
    const status = t.status || 'draft';
    const tagsHidden = Array.isArray(t.tags_hidden) ? t.tags_hidden : [];
    const tags = (Array.isArray(t.tags) ? t.tags : [])
      .map(tag => `<span class="p-tag${tagsHidden.includes(tag) ? ' hidden-tag' : ''}">${tag}</span>`)
      .join('');
    const stationMine = !!t.contributor_approved_station;
    const nileMine = !!t.contributor_approved_nile;
    const stationCurator = !!t.curator_approved_station;
    const nileCurator = !!t.curator_approved_nile;
    return `
      <div class="p-card">
        <div class="p-header">
          <div class="p-title-row">
            <div class="p-title">${t.title || '(untitled)'}</div>
            <span class="status-pill ${status}">${status}</span>
          </div>
          <div class="p-meta">${t.station_id || ''}</div>
        </div>
        ${tags ? `<div class="p-tags">${tags}</div>` : ''}
        ${t.synopsis ? `<div class="p-synopsis">${t.synopsis}</div>` : ''}
        <div class="p-approvals">
          <div class="p-approvals-label">Approve for release</div>
          <div class="p-approve-row">
            <button type="button" class="p-approve-pill${stationMine ? ' active' : ''}" onclick="toggleMine(${t.id}, 'station', ${stationMine})">Approved for this station</button>
            <span class="p-curator-note${stationCurator ? ' approved' : ''}">${stationCurator ? '✓ Curator has approved' : 'Curator has not approved yet'}</span>
          </div>
          <div class="p-approve-row">
            <button type="button" class="p-approve-pill${nileMine ? ' active' : ''}" onclick="toggleMine(${t.id}, 'nile', ${nileMine})">Approved for Nile</button>
            <span class="p-curator-note${nileCurator ? ' approved' : ''}">${nileCurator ? '✓ Curator has approved' : 'Curator has not approved yet'}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

// This is the Contributor's own half of the same two-key approval the
// curator casts from Station Dashboard — visibility only actually
// advances once both sides agree. A curator can never push this further
// than the contributor has approved.
async function toggleMine(id, level, isCurrentlyActive) {
  const field = level === 'station' ? 'contributor_approved_station' : 'contributor_approved_nile';
  try {
    const r = await fetch(`${NILE_API}/nile/tile/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, phone: PHONE, magic_auth_token: TOKEN, [field]: !isCurrentlyActive }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.message || 'Update failed.');
    }
    await loadMine();
  } catch (e) {
    alert(e.message);
  }
}
</script>
</body>
</html>
