<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONDA Archive</title>
<style>
  /* ── Theme tokens — overridden at runtime from Xano org config ── */
  :root {
    --accent:      #00C9BC;
    --accent-dim:  rgba(0,201,188,.15);
    --bg:          #0f1117;
    --surface:     #1a1d27;
    --surface2:    #141720;
    --border:      #252838;
    --border-dim:  #1e2030;
    --ink:         #e8eaf0;
    --ink-mid:     #c8d0e8;
    --muted:       #8890b8;
    --muted-dim:   #6870a0;
    --header-bg:   #F2F2F2;
    --header-border: #D0D0D0;
    --header-ink:  #222222;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    gap: 16px;
    flex-wrap: wrap;
    min-height: 64px;
  }
  .header-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .header-logo img {
    height: 36px;
    width: auto;
    display: block;
  }
  .header-logo-placeholder {
    min-width: 36px; height: 36px; border-radius: 6px;
    padding: 0 8px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--accent);
    letter-spacing: .05em;
  }
  .header-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
  }
  .eyebrow {
    font-size: 9px; text-transform: uppercase; letter-spacing: .14em;
    color: #888888;
  }
  .header-title {
    font-size: 17px; font-weight: 700; color: var(--accent);
    line-height: 1.2;
  }
  .header-tagline {
    font-size: 11px; color: #444444;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-count {
    font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }
  .powered-by {
    font-size: 10px; color: var(--muted-dim);
    text-decoration: none; white-space: nowrap;
  }
  .powered-by span { color: var(--accent); }

  /* ── Search bar ── */
  .search-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--header-border);
    padding: 8px 24px;
  }
  .search-bar-inner {
    max-width: 1000px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
  }
  .search-bar input {
    flex: 1; min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 13px;
    border-radius: 5px;
    padding: 7px 12px;
    outline: none;
    transition: border-color .15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted-dim); }

  .tag-list, .contributor-list { display: flex; flex-direction: column; gap: 4px; }
  .tag-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1px solid var(--border-dim);
    border-radius: 4px; padding: 9px 8px; font-size: 15px;
    cursor: pointer; width: 100%;
    transition: background .1s, color .1s, border-color .1s;
    white-space: nowrap; overflow: hidden; min-height: 36px;
  }
  .tag-main { display: flex; align-items: center; gap: 7px; overflow: hidden; min-width: 0; }
  .tag-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tag-star { flex-shrink: 0; color: var(--muted-dim); font-size: 14px; cursor: pointer; line-height: 1; }
  .tag-star:hover { color: var(--ink-mid); }
  .tag-star.active { color: #e0b400; }
  .tag-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tag-btn.favorite { border-color: #e0b400; }
  .tag-btn.related { color: var(--ink-mid); border-color: var(--border); }
  .tag-btn.related:hover { background: var(--surface); color: var(--ink); }
  .tag-btn.remaining { color: var(--muted); border-color: var(--border-dim); }
  .tag-btn.remaining:hover { background: var(--surface); color: var(--ink-mid); }
  .tag-count { font-size: 13px; flex-shrink: 0; opacity: .6; margin-left: 3px; }
  .tag-divider { border: none; border-top: 1px solid var(--border-dim); margin: 4px 0; }

  /* ── Topics drawer — off-canvas at every width, not just mobile, matching
     the same "collapsed until asked for" pattern the app's own Index panel
     already uses elsewhere. Keeps the left panel from ever having to fit
     an unbounded, ever-growing tag list permanently on screen. ── */
  .topics-toggle {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--ink-mid); border-radius: 5px; padding: 8px 14px;
    font-size: 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    font-family: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .topics-toggle:hover { background: var(--surface2); color: var(--ink); }
  .topics-toggle.has-active { border-color: var(--accent); color: var(--accent); }
  .topics-toggle .count {
    font-size: 10px; background: var(--accent-dim); color: var(--accent);
    border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
  }
  .tag-drawer-backdrop {
    /* top is set from JS to the real header+search-bar height at open time —
       keeps both fully visible and tappable instead of dimming/covering them. */
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
  }
  .tag-drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .tag-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(240px, 85vw);
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 1000; transform: translateX(100%); transition: transform .25s;
    display: flex; flex-direction: column;
  }
  .tag-drawer.open { transform: translateX(0); }
  .tag-drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .tag-drawer-header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-dim); }
  .tag-drawer-close {
    background: none; border: none; color: var(--muted); font-size: 20px;
    line-height: 1; cursor: pointer; padding: 4px 8px;
  }
  .tag-drawer-close:hover { color: var(--ink); }
  .tag-drawer .tag-list { padding: 12px 16px 24px; overflow-y: auto; flex: 1; }

  /* Contributor panel shares the same drawer shell as Tags — only one of
     the two is ever visible at once (toggled via [hidden]), swapped by
     whichever button opened the drawer. */
  .contributor-panel { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 0; overflow: hidden; }
  /* .tag-list and .contributor-panel both set their own `display`, which
     overrides the browser's default [hidden]{display:none} — without this,
     setting .hidden on either one stopped actually hiding it, and both
     panels rendered stacked together instead of one-at-a-time. */
  .tag-list[hidden], .contributor-panel[hidden] { display: none; }
  .drawer-search {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--ink); font-size: 15px; border-radius: 5px; padding: 8px 10px;
    margin-bottom: 10px; outline: none; flex-shrink: 0;
  }
  .drawer-search:focus { border-color: var(--accent); }
  .contributor-list { flex: 1; overflow-y: auto; padding-bottom: 24px; }
  .az-heading {
    font-size: 11px; font-weight: 700; color: var(--muted-dim);
    text-transform: uppercase; letter-spacing: .06em; padding: 10px 2px 2px;
  }
  .az-heading:first-child { padding-top: 2px; }
  .drawer-empty { padding: 16px 2px; color: var(--muted); font-size: 13px; }

  /* ── Right panel — full width, no sidebar to share space with ── */
  .right-panel {
    max-width: 1000px; margin: 0 auto;
    padding: 16px 20px 48px;
  }

  #status { font-size: 12px; color: var(--muted); padding: 6px 0 8px; }

  /* ── Cards — full-width stacked list, better for phones than a
     multi-column grid or a sideways-scrolling strip ── */
  .sessions { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; transition: border-color .15s, box-shadow .15s;
  }
  .card.open { border-color: var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  /* Row layout at every state now — cards are always full width, so there's
     no longer a cramped-grid-cell case that needed the centered/stacked
     collapsed look. Matches the Nile browse page's own tile layout. */
  .card-header {
    display: flex; flex-direction: row; align-items: center; text-align: left; gap: 14px;
    padding: 14px 18px; cursor: pointer; position: relative;
    -webkit-user-select: none; user-select: none;
  }
  .card-header:hover .card-title { color: var(--ink); }
  .chevron {
    flex-shrink: 0; position: absolute; top: 14px; right: 14px; width: 15px; height: 15px;
    color: var(--muted-dim); transition: transform .18s;
  }
  .card.open .chevron { transform: rotate(90deg); }
  .card-meta { flex: 1; min-width: 0; width: 100%; }
  .card-title { font-size: 15px; font-weight: 600; color: var(--ink-mid); margin-bottom: 4px; transition: color .15s; }
  .card-presenter { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .card-presenter-name { cursor: pointer; }
  .card-presenter-name:hover { color: var(--accent); text-decoration: underline; }
  .li-link {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; color: var(--accent); text-decoration: none; opacity: .8;
  }
  .li-link:hover { opacity: 1; }
  .li-icon { width: 11px; height: 11px; fill: currentColor; }

  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
  .badge {
    font-size: 10px; font-weight: 600; border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 6px;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); background: var(--surface2);
  }
  .badge-pending { border-color: #7a6a3a; color: #f0c070; }
  .badge-recording { border-color: #7a3a3a; color: #f09090; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .card-tag {
    font-size: 10px; border: 1px solid var(--border-dim);
    border-radius: 3px; padding: 1px 6px; color: var(--muted-dim);
    background: var(--surface2); cursor: pointer;
    transition: border-color .1s, color .1s;
  }
  .card-tag:hover { border-color: var(--accent); color: var(--ink-mid); }
  .card-tag.lit { border-color: var(--accent); color: var(--accent); }

  .card-avatar {
    flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: rgba(255,255,255,.85);
    align-self: center; letter-spacing: .03em;
  }
  .card-avatar-photo {
    flex-shrink: 0; width: 72px; height: 72px;
    border-radius: 50%; object-fit: cover; align-self: center;
  }
  .card.open .card-avatar,
  .card.open .card-avatar-photo { width: 48px; height: 48px; font-size: 15px; }

  .card-body { display: none; padding: 0 14px 14px 38px; }
  .card.open .card-body { display: block; }
  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted-dim); margin: 13px 0 5px;
  }
  .synopsis { color: var(--ink-mid); line-height: 1.65; font-size: 13px; }
  .takeaways { list-style: none; }
  .takeaways li {
    color: var(--ink-mid); padding: 3px 0 3px 16px;
    position: relative; font-size: 13px;
  }
  .takeaways li::before { content: "→"; position: absolute; left: 0; color: var(--muted-dim); }
  .who { color: var(--ink-mid); font-style: italic; font-size: 13px; }
  .brief-row { margin-top: 10px; font-size: 12px; color: var(--muted); }

  .action-row {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-top: 14px; align-items: center;
  }
  .onda-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #008B82; color: #fff; font-weight: 700; font-size: 14px;
    text-decoration: none; padding: 12px 22px; border-radius: 8px;
    transition: background .15s;
  }
  .onda-btn:hover { background: #00A399; }
  .onda-btn svg { display: block; flex-shrink: 0; }
  .buy-soon {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px;
  }

  .loading, .empty {
    text-align: center; padding: 4rem 2rem;
    color: var(--muted-dim); font-size: 14px;
  }

  footer {
    max-width: 1000px; margin: 0 auto; text-align: center;
    padding: 2rem; font-size: 11px; color: var(--muted-dim);
    border-top: 1px solid var(--header-border);
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* ── Pending tile ── */
  .card.pending { opacity: .7; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-logo" id="header-logo">
      <div class="header-logo-placeholder" id="logo-placeholder">O</div>
    </div>
    <div class="header-text">
      <div class="eyebrow">ONDA Replay · Chapter Archive</div>
      <div class="header-title" id="header-title">Loading…</div>
      <div class="header-tagline" id="header-tagline"></div>
    </div>
    <div class="header-right">
      <span class="header-count" id="header-count"></span>
      <a class="powered-by" href="https://ondareplay.com" target="_blank" rel="noopener">
        Powered by <span>ONDA Replay</span>
      </a>
    </div>
  </div>
</header>

<div class="search-bar">
  <div class="search-bar-inner">
    <input type="search" id="search-input" placeholder="Search sessions, contributors, tags…" autocomplete="off">
    <button type="button" class="topics-toggle" id="contributor-toggle" onclick="openDrawer('contributor')">
      <span>Contributor</span>
    </button>
    <button type="button" class="topics-toggle" id="topics-toggle" onclick="openDrawer('tags')">
      <span>Tags</span>
      <span class="count" id="topics-toggle-count" hidden></span>
    </button>
  </div>
</div>

<main class="right-panel">
  <div id="status"></div>
  <div class="sessions" id="sessions"><div class="loading">Loading archive…</div></div>
</main>

<div class="tag-drawer-backdrop" id="tag-drawer-backdrop" onclick="closeDrawer()"></div>
<div class="tag-drawer" id="tag-drawer">
  <div class="tag-drawer-header">
    <h2 id="drawer-title">Tags</h2>
    <button type="button" class="tag-drawer-close" onclick="closeDrawer()" aria-label="Close">×</button>
  </div>
  <div class="tag-list" id="tag-list"></div>
  <div class="contributor-panel" id="contributor-panel" hidden>
    <input type="text" id="contributor-search" class="drawer-search" placeholder="Find a contributor…" oninput="renderContributorList(this.value)">
    <div class="contributor-list" id="contributor-list"></div>
  </div>
</div>

<footer id="footer">
  <a href="https://ondanile.com" target="_blank" rel="noopener">ONDA Nile</a>
  &middot;
  <a href="https://ondareplay.com" target="_blank" rel="noopener">ondareplay.com</a>
</footer>

<script>
const NILE_API = 'https://xrxm-29on-xlyt.n7e.xano.io/api:onda-nile';

// ── Read URL params ────────────────────────────────────────────────────────────
// One ID per station, e.g. ?station=pca — no per-org code needed anywhere on
// this page. The old ?org_l1=&org_l2=&org_l3= three-part links still work too,
// so nothing already shared out in the wild breaks.
const params     = new URLSearchParams(location.search);
const STATION_ID = params.get('station') || '';
const ORG_L1     = params.get('org_l1') || '';
const ORG_L2     = params.get('org_l2') || '';
const ORG_L3     = params.get('org_l3') || '';
// Lets a plain Contributor (not a Curator) embed a version of this page on
// their own site showing only their own work — a personal catalog/following,
// distinct from the shared station feed. Locked, not just pre-filtered: the
// Contributor toggle is hidden entirely so a visitor can't wander into
// everyone else curated under the same station.
const LOCKED_PRESENTER = params.get('presenter') || '';

function humanizeStationId(id) {
  return id.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function initialsForStationId(id) {
  const parts = id.split('-').filter(Boolean);
  if (parts.length <= 1) return id.slice(0, 4).toUpperCase();
  return parts.map(p => /^\d+$/.test(p) ? p : p[0].toUpperCase()).join('');
}

// ── State ─────────────────────────────────────────────────────────────────────
let allSessions = [];
let allTags     = [];
const state     = { speaker: LOCKED_PRESENTER || 'all', tags: new Set(), query: '' };
if (LOCKED_PRESENTER) document.getElementById('contributor-toggle').style.display = 'none';

// ── Avatar helpers ─────────────────────────────────────────────────────────────
const _pal = ['#3a5a8a','#5a3a8a','#3a7a5a','#7a4a3a','#6a3a6a','#3a6a7a','#8a5a3a'];
function avatarColor(n) {
  let h = 0;
  for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) | 0;
  return _pal[Math.abs(h) % _pal.length];
}
function initials(n) {
  return n.split(/[\s,]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
window._thumbErr = function(img) {
  const d = document.createElement('div');
  d.className = 'card-avatar';
  d.style.background = avatarColor(img.dataset.name);
  d.textContent = initials(img.dataset.name);
  img.parentNode.replaceChild(d, img);
};

function playerUrlFor(url) {
  return 'https://default-dev-51573d-xrxm-29on-xlyt.n7e.xano.io/index.html?src=' + encodeURIComponent(url);
}

function openOnda(event, url) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (!isIOS) return true; // desktop/Android: the <a href> already points at the player
  event.preventDefault();
  // iOS: try the app first (it needs the raw .onda file, not the player page);
  // if it's not installed, fall back to the web player, not the raw file/API URL.
  window.location.href = 'ondareplay://open?url=' + encodeURIComponent(url);
  setTimeout(() => { window.location.href = playerUrlFor(url); }, 1500);
  return false;
}

// ── Color math: derive text/chip colors instead of storing them ────────────────
function hexToRgbArr(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function contrastTextColor(bgHex) {
  const [r,g,b] = hexToRgbArr(bgHex);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 150 ? '#141414' : '#FFFFFF';
}
function blendHex(hexA, hexB, ratio) { // ratio = weight of hexB, 0-1
  const a = hexToRgbArr(hexA), b = hexToRgbArr(hexB);
  const mixed = a.map((v,i) => Math.round(v*(1-ratio) + b[i]*ratio));
  return '#' + mixed.map(v => v.toString(16).padStart(2,'0')).join('');
}

// ── Apply org theme from Xano ──────────────────────────────────────────────────
function applyTheme(org) {
  if (!org) return;
  const r = document.documentElement;
  if (org.accent_color) {
    r.style.setProperty('--accent',      org.accent_color);
    r.style.setProperty('--accent-dim',  org.accent_color + '26');
  }
  if (org.bg_color)      r.style.setProperty('--bg', org.bg_color);
  if (org.surface_color && org.border_color) {
    const surface = org.surface_color, border = org.border_color;
    const ink = contrastTextColor(surface);
    const chipBg = blendHex(surface, border, 0.25);
    r.style.setProperty('--surface',       surface);
    r.style.setProperty('--surface2',      chipBg);
    r.style.setProperty('--border',        border);
    r.style.setProperty('--border-dim',    border);
    r.style.setProperty('--ink',           ink);
    r.style.setProperty('--ink-mid',       ink);
    r.style.setProperty('--muted',         blendHex(ink, surface, 0.45));
    r.style.setProperty('--muted-dim',     blendHex(ink, chipBg, 0.4));
    r.style.setProperty('--header-bg',     surface);
    r.style.setProperty('--header-border', border);
    r.style.setProperty('--header-ink',    ink);
  }
  if (org.font_family) {
    const linkId = 'custom-font-link';
    if (!document.getElementById(linkId)) {
      const link = document.createElement('link');
      link.id = linkId;
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(org.font_family).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(link);
    }
    r.style.setProperty('--font-body', `"${org.font_family}", -apple-system, BlinkMacSystemFont, sans-serif`);
  }

  const title = org.display_name || (STATION_ID ? humanizeStationId(STATION_ID) : [ORG_L1, ORG_L2, ORG_L3].filter(Boolean).join(' › '));
  document.title = 'ONDA Archive — ' + title;
  document.getElementById('header-title').textContent = title;
  if (org.tagline) document.getElementById('header-tagline').textContent = org.tagline;

  if (org.logo_url) {
    const placeholder = document.getElementById('logo-placeholder');
    const img = document.createElement('img');
    img.src = org.logo_url;
    img.alt = title;
    placeholder.parentNode.replaceChild(img, placeholder);
  } else {
    document.getElementById('logo-placeholder').textContent =
      STATION_ID ? initialsForStationId(STATION_ID) : (ORG_L1 || 'O')[0].toUpperCase();
  }
}

// ── Filter ─────────────────────────────────────────────────────────────────────
// A tile tagged "how-to" is a station's own orientation piece — it always
// floats to the top of whatever's currently visible, lead-in style, rather
// than sorting wherever the API happened to return it. Still subject to the
// same filters as everything else: pick an unrelated tag and it drops out
// like any other tile that doesn't match.
const PIN_TAG = 'how-to';

function filtered() {
  const rows = allSessions.filter(s => {
    if (state.speaker !== 'all' && s.presenter !== state.speaker) return false;
    if (state.tags.size > 0 && ![...state.tags].every(t => (s.tags||[]).includes(t))) return false;
    if (state.query) {
      const q   = state.query.toLowerCase();
      const hay = [s.title, s.presenter, s.synopsis, ...(s.tags||[])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    const aPinned = (a.tags||[]).includes(PIN_TAG);
    const bPinned = (b.tags||[]).includes(PIN_TAG);
    return aPinned === bPinned ? 0 : (aPinned ? -1 : 1);
  });
  return rows;
}

// ── Drawer — shared shell for both Tags and Contributor, only one panel
// visible at a time depending on which button opened it. ─────────────────────
function openDrawer(mode) {
  // Computed fresh each open (not a fixed CSS value) so the header+search-bar
  // stay fully visible and tappable even when the header wraps to two lines
  // on a narrow screen — a hardcoded pixel offset would break in that case.
  const headerH = document.querySelector('header').offsetHeight;
  const searchH = document.querySelector('.search-bar').offsetHeight;
  const topOffset = headerH + searchH + 'px';
  const drawer = document.getElementById('tag-drawer');
  const backdrop = document.getElementById('tag-drawer-backdrop');
  drawer.style.top = topOffset;
  backdrop.style.top = topOffset;

  document.getElementById('drawer-title').textContent = mode === 'contributor' ? 'Contributor' : 'Tags';
  document.getElementById('tag-list').hidden = mode !== 'tags';
  document.getElementById('contributor-panel').hidden = mode !== 'contributor';
  if (mode === 'contributor') {
    const search = document.getElementById('contributor-search');
    renderContributorList(search.value);
    search.focus();
  }

  drawer.classList.add('open');
  backdrop.classList.add('open');
}
function closeDrawer() {
  document.getElementById('tag-drawer').classList.remove('open');
  document.getElementById('tag-drawer-backdrop').classList.remove('open');
}

// ── Contributor search + A-Z list — built on demand when the drawer opens,
// not pre-built on load, so a large contributor list costs nothing until
// someone actually wants to browse it. ────────────────────────────────────
function renderContributorList(query) {
  const q = (query || '').trim().toLowerCase();
  const names = [...new Set(allSessions.map(s => s.presenter).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  const matches = q ? names.filter(n => n.toLowerCase().includes(q)) : names;
  const list = document.getElementById('contributor-list');
  list.innerHTML = '';

  if (!q) {
    list.appendChild(makeContributorBtn('all', 'All', null, state.speaker === 'all'));
  }
  let lastLetter = null;
  matches.forEach(name => {
    const letter = name[0].toUpperCase();
    if (letter !== lastLetter) {
      const heading = document.createElement('div');
      heading.className = 'az-heading';
      heading.textContent = letter;
      list.appendChild(heading);
      lastLetter = letter;
    }
    const count = allSessions.filter(s => s.presenter === name).length;
    list.appendChild(makeContributorBtn(name, name, count, state.speaker === name));
  });
  if (!matches.length) {
    const empty = document.createElement('div');
    empty.className = 'drawer-empty';
    empty.textContent = 'No matches.';
    list.appendChild(empty);
  }
}
// Real DOM element + addEventListener, same as makeTagBtn — the previous
// version built this as an HTML string with an inline onclick attribute,
// and JSON.stringify(name)'s double quotes collided with the double-quoted
// HTML attribute wrapping it, silently breaking the click on every name.
function makeContributorBtn(value, label, count, isActive) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tag-btn' + (isActive ? ' active' : '');
  btn.innerHTML = `<span>${label}</span>` + (count !== null ? `<span class="tag-count">${count}</span>` : '');
  btn.addEventListener('click', () => selectContributor(value));
  return btn;
}
function selectContributor(name) {
  state.speaker = name;
  render();
  closeDrawer();
}

// ── Tag panel ─────────────────────────────────────────────────────────────────
// Favorites are per-device only — never sent to Xano, matching the same
// "Make Favorite" pattern already built into the app's own Explore screen.
// Keyed per station so favorites on one archive don't bleed into another.
const FAV_KEY = 'onda_favorite_tags_' + (STATION_ID || 'default');
let favoriteTags;
try { favoriteTags = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
catch (_) { favoriteTags = new Set(); }

function toggleFavoriteTag(tag) {
  if (favoriteTags.has(tag)) favoriteTags.delete(tag); else favoriteTags.add(tag);
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favoriteTags])); } catch (_) {}
  renderTags(filtered());
}

function renderTags(rows) {
  const visible = new Set(rows.flatMap(s => s.tags || []));
  const el      = document.getElementById('tag-list');
  el.innerHTML  = '';

  const toggle      = document.getElementById('topics-toggle');
  const toggleCount = document.getElementById('topics-toggle-count');
  toggle.classList.toggle('has-active', state.tags.size > 0);
  toggleCount.hidden = state.tags.size === 0;
  toggleCount.textContent = state.tags.size;

  // Favorites float above every other group, regardless of whether they're
  // currently active or visible in the filtered results — a personal
  // shortcut list for common searches, always in the same spot.
  const favs = allTags.filter(({tag}) => favoriteTags.has(tag));
  favs.forEach(({tag, n}) => el.appendChild(makeTagBtn(tag, state.tags.has(tag) ? 'active' : 'favorite', n)));
  if (favs.length) el.appendChild(divider());

  const active  = [...state.tags].filter(t => !favoriteTags.has(t));
  active.forEach(t => el.appendChild(makeTagBtn(t, 'active', null)));

  const related   = allTags.filter(({tag}) => !state.tags.has(tag) && !favoriteTags.has(tag) && visible.has(tag));
  if ((active.length || favs.length) && related.length) el.appendChild(divider());
  related.forEach(({tag,n}) => el.appendChild(makeTagBtn(tag, 'related', n)));

  const remaining = allTags.filter(({tag}) => !state.tags.has(tag) && !favoriteTags.has(tag) && !visible.has(tag));
  if ((active.length || favs.length || related.length) && remaining.length) el.appendChild(divider());
  remaining.forEach(({tag,n}) => el.appendChild(makeTagBtn(tag, 'remaining', n)));
}
function makeTagBtn(tag, group, count) {
  const btn = document.createElement('button');
  btn.type  = 'button';
  btn.className = `tag-btn ${group}`;
  btn.dataset.tag = tag;
  const isFav = favoriteTags.has(tag);
  btn.innerHTML =
    `<span class="tag-main">` +
      `<span class="tag-star${isFav ? ' active' : ''}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '★' : '☆'}</span>` +
      `<span class="tag-label">${tag}</span>` +
    `</span>` +
    (count !== null ? `<span class="tag-count">${count}</span>` : '');
  btn.querySelector('.tag-star').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFavoriteTag(tag);
  });
  btn.addEventListener('click', () => {
    if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
    render();
  });
  return btn;
}
function divider() {
  const hr = document.createElement('hr'); hr.className = 'tag-divider'; return hr;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const rows       = filtered();
  const isFiltered = state.speaker !== 'all' || state.tags.size > 0 || state.query;
  document.getElementById('status').textContent =
    isFiltered ? `${rows.length} of ${allSessions.length} sessions` : `${allSessions.length} sessions`;
  document.getElementById('header-count').textContent =
    `${allSessions.length} session${allSessions.length !== 1 ? 's' : ''}`;

  renderTags(rows);
  document.getElementById('contributor-toggle').classList.toggle('has-active', state.speaker !== 'all');

  const container = document.getElementById('sessions');
  if (!rows.length) {
    const orgName = (STATION_ID && humanizeStationId(STATION_ID)) || [ORG_L3, ORG_L2, ORG_L1].find(Boolean) || 'This archive';
    const isFiltered = state.speaker !== 'all' || state.tags.size > 0 || state.query;
    if (isFiltered) {
      container.innerHTML = '<div class="empty">No results — try a different filter or search term.</div>';
    } else {
      container.innerHTML = `
        <div class="empty" style="line-height:1.8">
          <div style="font-size:15px;font-weight:600;color:var(--ink-mid);margin-bottom:8px">${orgName} hasn't been set up yet.</div>
          <div style="font-size:13px;color:var(--muted)">Sessions will appear here once an administrator creates the event lineup.<br>
          If you manage this archive, use the <strong style="color:var(--ink-mid)">Admin Sign In</strong> button to get started.</div>
        </div>`;
    }
    return;
  }

  container.innerHTML = '';
  rows.forEach(s => {
    const isPending = s.status === 'pending' || s.status === 'recording';

    const tags = (s.tags || []).map(t =>
      `<span class="card-tag${state.tags.has(t) ? ' lit' : ''}" data-tag="${t}">${t}</span>`
    ).join('');

    const liHtml = s.linkedin
      ? `<a class="li-link" href="${s.linkedin}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
           <svg class="li-icon" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
           LinkedIn
         </a>`
      : '';

    const visual = s.photo
      ? `<img class="card-avatar card-avatar-photo" loading="lazy" src="${s.photo}" alt="${s.presenter}" data-name="${s.presenter}" onerror="window._thumbErr(this)">`
      : `<div class="card-avatar" style="background:${avatarColor(s.presenter||'')}">${initials(s.presenter||'')}</div>`;

    const ondaBtn = (!isPending && s.onda_url)
      ? `<a class="onda-btn" href="${playerUrlFor(s.onda_url)}" target="_blank" rel="noopener"
             onclick="return openOnda(event,'${s.onda_url}')" title="Play recording">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
           Play
         </a>`
      : `<span class="buy-soon">${isPending ? '⏳ Coming soon' : 'Not yet available'}</span>`;

    const statusBadge = isPending
      ? `<span class="badge badge-${s.status}">${s.status === 'recording' ? '● Recording' : 'Coming Soon'}</span>`
      : '';

    const card = document.createElement('div');
    card.className = 'card' + (isPending ? ' pending' : '');
    card.innerHTML =
      `<div class="card-header">
        <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 4.293a1 1 0 011.414 0L14 9.586l-5.293 5.293a1 1 0 01-1.414-1.414L11.586 10 6.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
        ${visual}
        <div class="card-meta">
          <div class="card-title">${s.title}</div>
          <div class="card-presenter"><span class="card-presenter-name">${s.presenter}</span>${liHtml}</div>
          <div class="badges">${statusBadge}</div>
          <div class="card-tags">${tags}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="action-row">${ondaBtn}</div>
        ${s.synopsis ? `<div class="section-label">Synopsis</div><div class="synopsis">${s.synopsis}</div>` : ''}
        ${(s.takeaways||[]).length ? `<div class="section-label">Key Takeaways</div><ul class="takeaways">${s.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}
        ${(s.headings||[]).length ? `<div class="section-label">What's Covered</div><ul class="takeaways">${s.headings.map(h=>`<li>${h}</li>`).join('')}</ul>` : ''}
        ${s.who ? `<div class="section-label">Best For</div><div class="who">${s.who}</div>` : ''}
        ${s.brief ? `<div class="brief-row">${s.brief}</div>` : ''}
      </div>`;

    card.querySelector('.card-header').addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      container.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) card.classList.add('open');
    });
    const presenterNameEl = card.querySelector('.card-presenter-name');
    if (presenterNameEl && s.presenter) {
      presenterNameEl.addEventListener('click', e => {
        e.stopPropagation();
        state.speaker = s.presenter;
        render();
      });
    }
    card.querySelectorAll('.card-tag').forEach(chip => {
      chip.addEventListener('click', e => {
        e.stopPropagation();
        const t = chip.dataset.tag;
        if (state.tags.has(t)) state.tags.delete(t); else state.tags.add(t);
        render();
      });
    });

    container.appendChild(card);
  });
}

// ── Search ─────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  state.query = e.target.value.trim();
  render();
});

// ── Boot ───────────────────────────────────────────────────────────────────────
const PRESENTATIONS_API = 'https://xrxm-29on-xlyt.n7e.xano.io/api:presentations/list';

function normalizePresentation(p) {
  // A tile whose draft hasn't been generated yet stores takeaways/headings
  // as an empty {} object, not an array or a string — .split() on that
  // threw and silently killed the ENTIRE archive's render, not just that
  // one card, since this runs inside a .map() over every session. Only
  // treat it as text to split when it's actually a string; anything else
  // (including {}) becomes an empty list instead of crashing.
  const takeaways = (Array.isArray(p.takeaways) ? p.takeaways : (typeof p.takeaways === 'string' ? p.takeaways.split('\n') : []))
    .map(t => String(t).replace(/^→\s*/, '').trim())
    .filter(Boolean);
  const headings = (Array.isArray(p.headings) ? p.headings : (typeof p.headings === 'string' ? p.headings.split('\n') : []))
    .map(h => String(h).replace(/^→\s*/, '').trim())
    .filter(Boolean);
  return {
    id: 'pres-' + p.id,
    title: p.title || '',
    presenter: p.presenter_name || p.presenter || 'Unknown',
    org: p.org_l1 || 'Unknown',
    source: p.org_l1 || 'Unknown',
    tags: Array.isArray(p.tags) ? p.tags : (p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : []),
    synopsis: p.summary || '',
    takeaways,
    headings,
    who: p.audience || '',
    brief: p.brief || '',
    photo: p.photo_url || p.photo || null,
    onda_url: p.onda_url || null,
    status: p.status || null,
  };
}

(async () => {
  // Set default title from URL params while loading
  const defaultTitle = STATION_ID
    ? humanizeStationId(STATION_ID)
    : [ORG_L1, ORG_L2, ORG_L3].filter(Boolean).join(' › ') || 'Chapter Archive';
  document.getElementById('header-title').textContent = defaultTitle;
  document.title = 'ONDA Archive — ' + defaultTitle;

  // Fetch live presentations + org identity/skin in parallel — both from Xano.
  // station_id is the one identifier every new organization needs, going
  // forward — the old three-part org_l1/l2/l3 params still work as a fallback
  // for any link already shared out before this existed.
  const identityParams = STATION_ID
    ? new URLSearchParams({ station_id: STATION_ID })
    : new URLSearchParams({ org_l1: ORG_L1, org_l2: ORG_L2, org_l3: ORG_L3 });
  const [presResp, identityResp] = await Promise.all([
    fetch(PRESENTATIONS_API).catch(() => null),
    fetch(`https://xrxm-29on-xlyt.n7e.xano.io/api:nile/org/identity?${identityParams}`).catch(() => null),
  ]);

  // Apply org skin if available. Also resolves the effective station_id for
  // an old-style org_l1/l2/l3 link, straight from the matched record — so
  // filtering below never needs its own copy of the slug-to-station lookup.
  let resolvedStationId = STATION_ID || null;
  if (identityResp && identityResp.ok) {
    try {
      const skin = await identityResp.json();
      if (!resolvedStationId && skin.station_id) resolvedStationId = skin.station_id;
      const isCustom = skin.skin === 'custom';
      applyTheme({
        accent_color:    isCustom ? (skin.custom_accent || skin.accent_color) : skin.accent_color,
        bg_color:        isCustom ? skin.custom_page_bg : skin.bg_color,
        surface_color:   isCustom ? skin.custom_tile_bg : skin.surface_color,
        border_color:    isCustom ? skin.custom_border : null,
        display_name:    skin.wordmark,
        tagline:         skin.tagline,
        logo_url:        skin.logo_url || skin.badge_icon_url,
        font_family:     skin.font_family,
      });
    } catch(_) {}
  } else {
    document.getElementById('header-title').textContent = defaultTitle;
    document.getElementById('logo-placeholder').textContent =
      STATION_ID ? initialsForStationId(STATION_ID) : (ORG_L1 || 'O')[0].toUpperCase();
  }

  if (!presResp || !presResp.ok) {
    document.getElementById('sessions').innerHTML =
      `<div class="empty">Could not load sessions. Try again shortly.</div>`;
    return;
  }

  const allData = await presResp.json();
  const filtered = allData.filter(p =>
    // visibility 'public' or 'chapter' show on the station's own page;
    // 'private' (curator/admin-only) never does — that's what the Station
    // Dashboard is for.
    p.status === 'published' && p.visibility !== 'private' &&
      (!resolvedStationId || p.station_id === resolvedStationId)
  );

  allSessions = filtered.map(normalizePresentation);

  // Build ranked tag list
  const tagCount = {};
  allSessions.forEach(s => (s.tags||[]).forEach(t => { tagCount[t] = (tagCount[t]||0)+1; }));
  allTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).map(([tag,n])=>({tag,n}));

  render();
})();
</script>
</body>
</html>
