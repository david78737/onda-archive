<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONDA Nile — Knowledge you can navigate.</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #F0F0F0;
    color: #333333;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: #008787;
    padding: 14px 24px;
  }
  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header-wordmark {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .04em;
  }
  .header-tagline {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    margin-left: 4px;
  }
  .header-right {
    margin-left: auto;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
  }

  /* ── Search bar ── */
  .search-bar {
    background: #D4EBEB;
    border-bottom: 2px solid #008787;
    padding: 10px 24px;
    box-shadow: 0 2px 6px rgba(0,150,136,0.12);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .search-bar-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-bar input {
    flex: 1;
    min-width: 0;
    border: 1px solid #C0C0C0;
    background: #FFFFFF;
    color: #333333;
    font-size: 14px;
    border-radius: 6px;
    padding: 8px 12px;
    outline: none;
  }
  .search-bar input:focus { border-color: #008787; }
  .search-bar input::placeholder { color: #AAAAAA; }

  /* ── Active filter chips — shows what's actually selected at a glance,
     without needing to open the drawer to check. Source stays left,
     Tags stay right, so the two dimensions never blend together. ── */
  .active-filters {
    max-width: 1000px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; flex-wrap: wrap;
    padding-top: 8px;
  }
  .active-filters[hidden] { display: none; }
  .active-filters-source, .active-filters-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .active-filters-tags { margin-left: auto; justify-content: flex-end; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #FFFFFF; border: 1px solid #008787; color: #006F6F;
    border-radius: 100px; padding: 3px 6px 3px 10px;
    font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .filter-chip:hover { background: #E8F8F6; }
  .filter-chip .chip-x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    background: #E0F2F0; font-size: 11px; line-height: 1;
  }
  .filter-chip:hover .chip-x { background: #008787; color: #fff; }

  /* ── Search-bar controls — Source and Tags open the same off-canvas
     drawer, matching the station-page pattern so both properties share
     one layout and only the content differs. ── */
  .topics-toggle {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #FFFFFF; border: 1px solid #C0C0C0;
    color: #333333; border-radius: 6px; padding: 8px 14px;
    font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    font-family: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .topics-toggle:hover { background: #F0F0F0; }
  .topics-toggle.has-active { border-color: #008787; color: #008787; }
  .topics-toggle .count {
    font-size: 10px; background: #D4EBEB; color: #008787;
    border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
  }

  /* ── Drawer — shared shell for Source and Tags, off-canvas at every
     width so the results panel is always full width, no sidebar. ── */
  .tag-drawer-backdrop {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
  }
  .tag-drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .tag-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(240px, 85vw);
    background: #FFFFFF; border-left: 1px solid #D0D0D0;
    z-index: 1000; transform: translateX(100%); transition: transform .25s;
    display: flex; flex-direction: column;
  }
  .tag-drawer.open { transform: translateX(0); }
  .tag-drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px; border-bottom: 1px solid #E0E0E0;
  }
  .tag-drawer-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #888888; }
  .tag-drawer-close {
    background: none; border: none; color: #999999; font-size: 20px;
    line-height: 1; cursor: pointer; padding: 4px 8px;
  }
  .tag-drawer-close:hover { color: #333333; }
  .tag-drawer .tag-list, .tag-drawer .source-list {
    padding: 12px 16px 24px; overflow-y: auto; flex: 1;
    display: flex; flex-direction: column; gap: 3px;
  }
  .tag-list[hidden], .source-list[hidden] { display: none; }

  .tag-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: #FFFFFF;
    border: 1px solid #C8C8C8;
    border-radius: 4px; padding: 6px 8px;
    font-size: 11px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #555555; text-align: left; width: 100%; min-height: 28px;
  }
  .tag-btn:hover { background: #F8F8F8; border-color: #008787; color: #008787; }
  .tag-btn.active { background: #008787; border-color: #008787; color: #fff; font-weight: 600; }
  .tag-btn.related { color: #333333; border-color: #008787; background: #FFFFFF; }
  .tag-btn.related:hover { background: #D4EBEB; }
  .tag-btn.remaining { color: #BBBBBB; border-color: #E0E0E0; background: #FFFFFF; }
  .tag-btn.remaining:hover { background: #F8F8F8; color: #888888; border-color: #CCCCCC; }
  .tag-count { font-size: 10px; opacity: .6; margin-left: 4px; flex-shrink: 0; }
  .tag-divider { width: 100%; border: none; border-top: 1px solid #E8E8E8; margin: 6px 0; }
  .tag-btn.favorite { border-color: #e0b400; }
  .tag-main { display: flex; align-items: center; gap: 7px; overflow: hidden; min-width: 0; }
  .tag-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tag-star { flex-shrink: 0; color: #BBBBBB; font-size: 14px; cursor: pointer; line-height: 1; }
  .tag-star:hover { color: #555555; }
  .tag-star.active { color: #e0b400; }

  /* ── Right panel — full width, no sidebar to share space with ── */
  .right-panel {
    max-width: 1000px;
    margin: 0 auto;
    padding: 16px 20px 48px;
  }

  #status { font-size: 12px; color: #888888; padding: 4px 0 10px; }

  /* ── Session cards ── */
  .sessions { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: #FFFFFF;
    border: 1px solid #DCDCDC;
    border-radius: 8px;
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: #008787; box-shadow: 0 1px 4px rgba(0,150,136,0.12); }
  .card.open { border-color: #008787; }

  .card-header {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .chevron {
    flex-shrink: 0; margin-top: 4px; width: 14px; height: 14px;
    color: #AAAAAA; transition: transform .18s;
  }
  .card.open .chevron { transform: rotate(90deg); }

  .card-avatar {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: rgba(255,255,255,.9);
    align-self: center; background: #3a5a8a;
  }
  .card-avatar-photo { object-fit: cover; }
  .card-thumb {
    flex-shrink: 0; width: 96px; height: 60px;
    border-radius: 5px; object-fit: cover;
    background: #E8E8E8; align-self: center;
  }
  /* Presentations photos are tall phone screenshots, not 16:9 video
     thumbnails — sized and fitted differently so the whole screen shows
     instead of a thin cropped sliver from the middle. */
  .card-thumb-tall {
    flex-shrink: 0; width: 130px; height: 200px;
    border-radius: 5px; object-fit: contain;
    background: #E8E8E8; align-self: center;
  }

  .card-meta { flex: 1; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 700; color: #222222; margin-bottom: 2px; }
  .card-presenter { font-size: 12px; color: #888888; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .li-link { display: inline-flex; align-items: center; gap: 3px; color: #0077B5; font-size: 11px; text-decoration: none; white-space: nowrap; }
  .li-link:hover { text-decoration: underline; }
  .li-icon { width: 13px; height: 13px; fill: #0077B5; flex-shrink: 0; }

  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
  .badge {
    font-size: 10px; font-weight: 600; border: 1px solid;
    border-radius: 3px; padding: 1px 6px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .badge-source { border-color: #008787; color: #008787; text-decoration: none; cursor: pointer; }
  .badge-source:hover { opacity: .8; }
  .badge-update {
    border-color: #008787; color: #fff; background: #008787;
    text-decoration: none; cursor: pointer;
  }
  .badge-update:hover { background: #007a70; border-color: #007a70; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .card-tag {
    font-size: 10px; border: 1px solid #008787; border-radius: 3px;
    padding: 1px 6px; color: #555555; background: #FFFFFF; cursor: pointer;
    transition: all .1s;
  }
  .card-tag:hover { border-color: #008787; color: #008787; background: #F0FAF9; }
  .card-tag.lit { border-color: #008787; color: #008787; background: #E8F8F6; font-weight: 600; }

  /* ── Card body ── */
  .card-body { display: none; padding: 0 16px 16px 42px; }
  .card.open .card-body { display: block; }

  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: #008787; margin: 12px 0 4px; font-weight: 600;
  }
  .synopsis { color: #444444; line-height: 1.65; font-size: 13px; }
  .takeaways { list-style: none; }
  .takeaways li {
    color: #555555; padding: 3px 0 3px 18px;
    position: relative; font-size: 13px;
  }
  .takeaways li::before { content: "→"; position: absolute; left: 0; color: #008787; }
  .who { color: #555555; font-style: italic; font-size: 13px; }
  .brief-row { margin-top: 8px; font-size: 12px; color: #888888; }

  /* ── Action row ── */
  .action-row {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-top: 16px; align-items: center;
  }

  .yt-btn { display: inline-block; text-decoration: none; line-height: 0; transition: opacity .15s; }
  .yt-btn:hover { opacity: .8; }
  .yt-btn img { display: block; height: 32px; width: auto; }

  .onda-btn { display: inline-block; text-decoration: none; line-height: 0; transition: opacity .15s; }
  .onda-btn:hover { opacity: .85; }
  .onda-btn img { display: block; height: 44px; width: auto; }

  /* ── Buy button (paid content) ── */
  .buy-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #008787; color: #fff;
    border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    transition: background .15s;
  }
  .buy-btn:hover { background: #006F6F; }
  .buy-price {
    background: rgba(255,255,255,0.2);
    border-radius: 4px; padding: 2px 7px;
    font-size: 12px; font-weight: 600;
  }
  .buy-soon {
    display: inline-flex; align-items: center;
    background: #F0F0F0; color: #AAAAAA;
    border: 1px solid #DCDCDC; border-radius: 6px;
    padding: 9px 16px; font-size: 12px;
  }

  .loading, .empty {
    text-align: center; padding: 4rem 2rem;
    color: #AAAAAA; font-size: 14px;
  }

  footer {
    max-width: 1000px; margin: 0 auto;
    text-align: center; padding: 1rem 2rem 2rem; font-size: 11px; color: #AAAAAA;
  }
  footer a { color: #008787; text-decoration: none; }
  .header-link { color: rgba(255,255,255,0.9); text-decoration: underline; }

  @media (max-width: 640px) {
    /* Branding takes a back seat to the controls people actually use —
       drop the tagline entirely and let "Powered by" sit compactly in
       the space it vacates instead of wrapping onto its own row. */
    .header-tagline { display: none; }
    .header-right { margin-left: 0; font-size: 10px; }

  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="date_palm.png" alt="ONDA Nile" style="height:40px;width:auto;flex-shrink:0;">
    <div>
      <div class="header-wordmark">ONDA Nile</div>
      <div class="header-tagline">Stop googling. Start navigating.</div>
    </div>
    <div class="header-right" id="header-right">Powered by <a href="https://ondareplay.com" target="_blank" rel="noopener" class="header-link">ONDA Replay</a></div>
  </div>
</header>

<div class="search-bar">
  <div class="search-bar-inner">
    <input type="search" id="search-input" placeholder="Search by word, topic, or speaker…" autocomplete="off">
    <button type="button" class="topics-toggle" id="source-toggle" onclick="openDrawer('source')">
      <span>Source</span>
    </button>
    <button type="button" class="topics-toggle" id="topics-toggle" onclick="openDrawer('tags')">
      <span>Tags</span>
      <span class="count" id="topics-toggle-count" hidden></span>
    </button>
  </div>
  <div class="active-filters" id="active-filters" hidden>
    <div class="active-filters-source" id="active-filters-source"></div>
    <div class="active-filters-tags" id="active-filters-tags"></div>
  </div>
</div>

<main class="right-panel">
  <div id="status"></div>
  <div class="sessions" id="sessions"><div class="loading">Loading…</div></div>
</main>

<div class="tag-drawer-backdrop" id="tag-drawer-backdrop" onclick="closeDrawer()"></div>
<div class="tag-drawer" id="tag-drawer">
  <div class="tag-drawer-header">
    <h2 id="drawer-title">Tags</h2>
    <button type="button" class="tag-drawer-close" onclick="closeDrawer()" aria-label="Close">×</button>
  </div>
  <div class="tag-list" id="tag-list"></div>
  <div class="source-list" id="source-list" hidden></div>
</div>


<footer>
  ONDA Nile &middot; <a href="https://ondareplay.com">ondareplay.com</a> &middot; Knowledge you can navigate.
</footer>

<script>
// ── Query-string params ───────────────────────────────────────────────────────
const _params = new URLSearchParams(location.search);
const LOCKED_TAG     = _params.get('tag')      || null;
const LOCKED_SKIN    = _params.get('skin')     || null;
const LOCKED_LANG    = _params.get('lang')     || null;
const LOCKED_COUNTRY = _params.get('country')  || null;
const LOCKED_CURATOR = _params.get('curator')  || null;
const LOCKED_L1      = _params.get('org_l1')   || null;
const LOCKED_L2      = _params.get('org_l2')   || null;
const LOCKED_L3      = _params.get('org_l3')   || null;
const LOCKED_QUERY   = _params.get('q')        || null;

// Inject skin stylesheet before any render
if (LOCKED_SKIN) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `skins/${LOCKED_SKIN}.css`;
  document.head.appendChild(link);
}

// Add Sign in link when running as a curator station
if (LOCKED_SKIN) {
  const signinParams = new URLSearchParams();
  signinParams.set('skin', LOCKED_SKIN);
  if (LOCKED_L1) signinParams.set('org_l1', LOCKED_L1);
  if (LOCKED_L2) signinParams.set('org_l2', LOCKED_L2);
  if (LOCKED_L3) signinParams.set('org_l3', LOCKED_L3);
  const headerRight = document.getElementById('header-right');
  if (headerRight) {
    headerRight.innerHTML = `<a href="../nile-admin/signin.html?${signinParams}" class="header-link">Sign in</a>`;
  }
}

// ── Data + state ──────────────────────────────────────────────────────────────
let allSessions = [];
let allTags = [];
const state = { org: 'all', tags: new Set(), query: LOCKED_QUERY || '' };
if (LOCKED_TAG) state.tags.add(LOCKED_TAG);

// ── Favorites — per-device only, same "star it, it floats to the top"
// pattern as the station page's Tags panel, now covering Source too. ───────
function loadFavSet(key) {
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
  catch (_) { return new Set(); }
}
function saveFavSet(key, set) {
  try { localStorage.setItem(key, JSON.stringify([...set])); } catch (_) {}
}
const favoriteTags    = loadFavSet('onda_nile_favorite_tags');
const favoriteSources = loadFavSet('onda_nile_favorite_sources');
function toggleFavoriteTag(tag) {
  if (favoriteTags.has(tag)) favoriteTags.delete(tag); else favoriteTags.add(tag);
  saveFavSet('onda_nile_favorite_tags', favoriteTags);
  renderTags(filtered());
}
function toggleFavoriteSource(org) {
  if (favoriteSources.has(org)) favoriteSources.delete(org); else favoriteSources.add(org);
  saveFavSet('onda_nile_favorite_sources', favoriteSources);
  renderSourceList();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const _palette = ['#3a5a8a','#5a3a8a','#3a7a5a','#7a4a3a','#6a3a6a','#3a6a7a','#8a5a3a','#2a6a4a'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return _palette[Math.abs(h) % _palette.length];
}
function initials(name) {
  return name.split(/[\s,]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}
window._thumbErr = function(img) {
  const div = document.createElement('div');
  div.className = 'card-avatar';
  div.style.background = avatarColor(img.dataset.name);
  div.textContent = initials(img.dataset.name);
  img.parentNode.replaceChild(div, img);
};

function openOnda(event, url) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (!isIOS) return true;
  event.preventDefault();
  window.location.href = 'ondareplay://open?url=' + encodeURIComponent(url);
  setTimeout(() => { window.location.href = url; }, 1500);
  return false;
}

// ── Filter ────────────────────────────────────────────────────────────────────
function filtered() {
  return allSessions.filter(s => {
    if (state.org !== 'all' && s.org !== state.org) return false;
    if (state.tags.size > 0 && ![...state.tags].every(t => s.tags.includes(t))) return false;
    if (LOCKED_LANG    && s.language && s.language !== LOCKED_LANG)    return false;
    if (LOCKED_COUNTRY && s.country  && s.country  !== LOCKED_COUNTRY) return false;
    if (LOCKED_CURATOR && s.curator  && s.curator  !== LOCKED_CURATOR) return false;
    if (state.query) {
      const q = state.query.toLowerCase();
      const hay = [s.title, s.presenter, s.org, s.source, s.synopsis, ...s.tags, s.linkedin||''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── Drawer — shared shell for Source and Tags, only one panel visible
// at a time depending on which button opened it. ────────────────────────────
function openDrawer(mode) {
  // Computed fresh each open (not a fixed CSS value) so the header+search-bar
  // stay fully visible and tappable even when the header wraps to two lines
  // on a narrow screen — a hardcoded pixel offset would break in that case.
  const headerH = document.querySelector('header').offsetHeight;
  const searchH = document.querySelector('.search-bar').offsetHeight;
  const topOffset = headerH + searchH + 'px';
  const drawer = document.getElementById('tag-drawer');
  const backdrop = document.getElementById('tag-drawer-backdrop');
  drawer.style.top = topOffset;
  backdrop.style.top = topOffset;

  document.getElementById('drawer-title').textContent = mode === 'source' ? 'Source' : 'Tags';
  document.getElementById('tag-list').hidden = mode !== 'tags';
  document.getElementById('source-list').hidden = mode !== 'source';
  if (mode === 'source') renderSourceList();

  drawer.classList.add('open');
  backdrop.classList.add('open');
}
function closeDrawer() {
  document.getElementById('tag-drawer').classList.remove('open');
  document.getElementById('tag-drawer-backdrop').classList.remove('open');
}

// ── Source list — built on demand when the drawer opens, single-select
// like Contributor on the station page: picking one closes the drawer. ─────
function renderSourceList() {
  const orgs = [...new Set(allSessions.map(s => s.org))].sort();
  const list = document.getElementById('source-list');
  list.innerHTML = '';
  list.appendChild(makeSourceBtn('all', 'All', false));

  const favs = orgs.filter(org => favoriteSources.has(org));
  favs.forEach(org => list.appendChild(makeSourceBtn(org, org, true)));
  if (favs.length) list.appendChild(divider());

  const rest = orgs.filter(org => !favoriteSources.has(org));
  rest.forEach(org => list.appendChild(makeSourceBtn(org, org, true)));
}
function makeSourceBtn(value, label, favoritable) {
  const btn = document.createElement('button');
  btn.type = 'button';
  const isFav = favoritable && favoriteSources.has(value);
  btn.className = 'tag-btn' + (state.org === value ? ' active' : '') + (isFav ? ' favorite' : '');
  const star = favoritable
    ? `<span class="tag-star${isFav ? ' active' : ''}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '★' : '☆'}</span>`
    : '';
  btn.innerHTML = `<span class="tag-main">${star}<span class="tag-label">${label}</span></span>`;
  if (favoritable) {
    btn.querySelector('.tag-star').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavoriteSource(value);
    });
  }
  btn.addEventListener('click', () => {
    state.org = value;
    render();
    closeDrawer();
  });
  return btn;
}

// ── Tag panel ─────────────────────────────────────────────────────────────────
function renderTags(rows) {
  const toggle      = document.getElementById('topics-toggle');
  const toggleCount = document.getElementById('topics-toggle-count');
  toggle.classList.toggle('has-active', state.tags.size > 0);
  toggleCount.hidden = state.tags.size === 0;
  toggleCount.textContent = state.tags.size;

  // If locked tag filter produces no results, hide the tag list entirely
  if (LOCKED_TAG && rows.length === 0) {
    document.getElementById('tag-list').innerHTML = '';
    return;
  }
  const visibleSet = new Set(rows.flatMap(s => s.tags));
  const listEl = document.getElementById('tag-list');
  listEl.innerHTML = '';

  // Favorites float above every other group, regardless of whether they're
  // currently active or visible in the filtered results.
  const favs = allTags.filter(({tag}) => tag !== LOCKED_TAG && favoriteTags.has(tag));
  favs.forEach(({tag, n}) => listEl.appendChild(makeTagBtn(tag, state.tags.has(tag) ? 'active' : 'favorite', n)));
  if (favs.length) listEl.appendChild(divider());

  const active = [...state.tags].filter(t => t !== LOCKED_TAG && !favoriteTags.has(t));
  active.forEach(t => listEl.appendChild(makeTagBtn(t, 'active', null)));

  const related = allTags.filter(({tag}) => tag !== LOCKED_TAG && !state.tags.has(tag) && !favoriteTags.has(tag) && visibleSet.has(tag));
  if ((active.length || favs.length) && related.length) listEl.appendChild(divider());
  related.forEach(({tag, n}) => listEl.appendChild(makeTagBtn(tag, 'related', n)));

  const remaining = allTags.filter(({tag}) => tag !== LOCKED_TAG && !state.tags.has(tag) && !favoriteTags.has(tag) && !visibleSet.has(tag));
  if ((active.length || favs.length || related.length) && remaining.length) listEl.appendChild(divider());
  remaining.forEach(({tag, n}) => listEl.appendChild(makeTagBtn(tag, 'remaining', n)));
}

function makeTagBtn(tag, group, count) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = `tag-btn ${group}`;
  btn.dataset.tag = tag;
  const isFav = favoriteTags.has(tag);
  btn.innerHTML =
    `<span class="tag-main">` +
      `<span class="tag-star${isFav ? ' active' : ''}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '★' : '☆'}</span>` +
      `<span class="tag-label">${tag}</span>` +
    `</span>` +
    (count !== null ? `<span class="tag-count">${count}</span>` : '');
  btn.querySelector('.tag-star').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFavoriteTag(tag);
  });
  btn.addEventListener('click', () => {
    if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
    render();
  });
  return btn;
}

function divider() {
  const hr = document.createElement('hr');
  hr.className = 'tag-divider';
  return hr;
}

// ── Active filter chips — what's actually selected, visible without
// opening the drawer. Clicking a chip's × removes just that one filter. ────
function renderActiveFilters() {
  const wrap       = document.getElementById('active-filters');
  const sourceZone = document.getElementById('active-filters-source');
  const tagsZone   = document.getElementById('active-filters-tags');
  sourceZone.innerHTML = '';
  tagsZone.innerHTML   = '';

  if (state.org !== 'all') {
    sourceZone.appendChild(makeFilterChip(state.org, () => {
      state.org = 'all';
      render();
    }));
  }
  const removableTags = [...state.tags].filter(t => t !== LOCKED_TAG);
  removableTags.forEach(tag => {
    tagsZone.appendChild(makeFilterChip(tag, () => {
      state.tags.delete(tag);
      render();
    }));
  });

  wrap.hidden = state.org === 'all' && removableTags.length === 0;
}
function makeFilterChip(label, onRemove) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'filter-chip';
  chip.innerHTML = `${label} <span class="chip-x">×</span>`;
  chip.addEventListener('click', onRemove);
  return chip;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const rows = filtered();
  const isFiltered = state.org !== 'all' || state.tags.size > 0 || state.query;
  document.getElementById('status').textContent =
    isFiltered ? `${rows.length} of ${allSessions.length} items` : `${allSessions.length} items`;
  document.getElementById('source-toggle').classList.toggle('has-active', state.org !== 'all');
  renderActiveFilters();

  renderTags(rows);

  const container = document.getElementById('sessions');
  if (!rows.length) {
    container.innerHTML = '<div class="empty">No results. Try a different topic or search term.</div>';
    return;
  }

  container.innerHTML = '';
  rows.forEach(s => {
    const tagChips = s.tags.map(t =>
      `<span class="card-tag${state.tags.has(t) ? ' lit' : ''}" data-tag="${t}">${t}</span>`
    ).join('');

    const liHtml = s.linkedin
      ? '<a class="li-link" href="' + s.linkedin + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">'
        + '<svg class="li-icon" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
        + 'LinkedIn</a>'
      : '';

    const bgColor = avatarColor(s.presenter);
    const visual = (s.photo && s.photoStyle === 'thumb')
      ? `<img class="card-thumb-tall" loading="lazy" src="${s.photo}" alt="${s.title}"
             data-name="${s.presenter}" onerror="window._thumbErr(this)">`
      : s.photo
      ? `<img class="card-avatar card-avatar-photo" loading="lazy" src="${s.photo}" alt="${s.presenter}"
             data-name="${s.presenter}" onerror="window._thumbErr(this)">`
      : s.youtube
      ? `<img class="card-thumb" loading="lazy" alt=""
             src="https://img.youtube.com/vi/${s.youtube}/hqdefault.jpg"
             data-name="${s.presenter}" onerror="window._thumbErr(this)">`
      : `<div class="card-avatar" data-bg="${bgColor}">${initials(s.presenter)}</div>`;

    const ytBtn = s.youtube
      ? `<a class="yt-btn" href="https://www.youtube.com/watch?v=${s.youtube}" target="_blank" rel="noopener" aria-label="Watch on YouTube">
           <img src="../img/yt-logo.svg" alt="Watch on YouTube">
         </a>`
      : '';

    // Opens the hosted web player (play in-browser, download link lives inside
    // the player itself) instead of force-downloading the raw .onda file.
    // The iOS app deep-link still passes the raw file — the app needs the
    // actual .onda, not the player page.
    const playerUrl = 'https://default-dev-51573d-xrxm-29on-xlyt.n7e.xano.io/index.html?src=' + encodeURIComponent(s.onda_url || '');
    const ondaBtn = (s.onda_url && s.status !== 'pending')
      ? `<a class="onda-btn" href="${playerUrl}" target="_blank" rel="noopener"
             onclick="return openOnda(event,'${s.onda_url}')" title="Play recording">
           <img src="../img/onda-download.png" alt="Play recording">
         </a>`
      : (s.status === 'pending' ? `<span class="buy-soon">Recording coming soon</span>` : '');

    const STATION_MAP = {
      'Elevate Summit':     { color: '#004EFF', url: '../chapter/?org_l1=elevate&org_l2=summit&org_l3=elevate-summit' },
      'ProductCamp Austin': { color: '#EE3947', url: '../chapter/?org_l1=productcamp&org_l2=austin&org_l3=pca' },
      'Toastmasters':       { color: '#004165', url: '../chapter/?org_l1=toastmasters&org_l2=austin&org_l3=chapter-47' },
    };
    const station = STATION_MAP[s.org];
    const sourceBadge = station
      ? `<a class="badge badge-source" href="${station.url}"
            style="color:${station.color};border-color:${station.color}"
            title="View all ${s.org} sessions" onclick="event.stopPropagation()">${s.source}</a>`
      : `<span class="badge badge-source">${s.source}</span>`;
    const actionRow = `<div class="action-row">${ytBtn}${ondaBtn}</div>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      `<div class="card-header">
        <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 4.293a1 1 0 011.414 0L14 9.586l-5.293 5.293a1 1 0 01-1.414-1.414L11.586 10 6.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
        ${visual}
        <div class="card-meta">
          <div class="card-title">${s.title}</div>
          <div class="card-presenter">
            <span>${s.presenter}</span>
            ${liHtml}
          </div>
          <div class="badges">
            ${sourceBadge}
            ${s.id.toString().startsWith('nile-')
              ? (s.status === 'unclaimed' && s.invite_code
                  ? `<a class="badge badge-update" href="../nile-claim/?session_id=${s.id.toString().replace('nile-','')}&invite_code=${encodeURIComponent(s.invite_code)}" onclick="event.stopPropagation()">claim</a>`
                  : `<a class="badge badge-update" href="../nile-session-update/?session_id=${s.id.toString().replace('nile-','')}" onclick="event.stopPropagation()">update</a>`)
              : ''}
          </div>
          <div class="card-tags">${tagChips}</div>
        </div>
      </div>
      <div class="card-body">
        ${s.synopsis ? `<div class="section-label">Synopsis</div><div class="synopsis">${s.synopsis}</div>` : ''}
        ${Array.isArray(s.takeaways) && s.takeaways.length
          ? `<div class="section-label">Key Takeaways</div><ul class="takeaways">${s.takeaways.map(t => `<li>${t}</li>`).join('')}</ul>`
          : ''}
        ${Array.isArray(s.headings) && s.headings.length
          ? `<div class="section-label">What's Covered</div><ul class="takeaways">${s.headings.map(h => `<li>${h}</li>`).join('')}</ul>`
          : ''}
        ${s.who ? `<div class="section-label">Best For</div><div class="who">${s.who}</div>` : ''}
        ${s.brief ? `<div class="brief-row">${s.brief}</div>` : ''}
        ${s.proxy && s.status !== 'live' ? `<div style="margin-top:12px;font-size:12px;color:#888;">Recording code: <strong style="color:#008787;letter-spacing:.05em;">${s.proxy}</strong></div>` : ''}
        ${actionRow}
      </div>`;

    card.querySelector('.card-header').addEventListener('click', () => card.classList.toggle('open'));
    card.querySelectorAll('.card-tag').forEach(chip => {
      chip.addEventListener('click', e => {
        e.stopPropagation();
        const t = chip.dataset.tag;
        if (state.tags.has(t)) state.tags.delete(t); else state.tags.add(t);
        render();
      });
    });

      // Apply avatar background color via JS after insert (avoids inline style)
    card.querySelectorAll('.card-avatar[data-bg]').forEach(el => {
      el.style.background = el.dataset.bg;
    });

    container.appendChild(card);
  });
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  state.query = e.target.value.trim();
  render();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
const PRESENTATIONS_API = 'https://xrxm-29on-xlyt.n7e.xano.io/api:presentations/list';

// Temporary: org_id -> display name, until presentations has a public org-list endpoint.
const ORG_NAMES = { 5: 'ONDA Replay', 4: 'Circle Docs' };

function normalizePresentation(p) {
  const orgName = ORG_NAMES[p.org_id] || p.org_l1 || 'Unknown';
  const takeaways = (Array.isArray(p.takeaways) ? p.takeaways : (p.takeaways || '').split('\n'))
    .map(t => String(t).replace(/^→\s*/, '').trim())
    .filter(Boolean);
  const headings = (Array.isArray(p.headings) ? p.headings : (p.headings || '').split('\n'))
    .map(h => String(h).replace(/^→\s*/, '').trim())
    .filter(Boolean);
  return {
    id: 'pres-' + p.id,
    title: p.title || '',
    presenter: p.presenter_name || p.presenter || 'ONDA Doc',
    org: orgName,
    source: orgName,
    tags: Array.isArray(p.tags) ? p.tags : (p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : []),
    synopsis: p.summary || '',
    takeaways,
    headings,
    who: p.audience || '',
    brief: p.brief || '',
    youtube: p.youtube || null,
    photo: p.photo_url || p.photo || null,
    // The tall phone-screenshot treatment is only right for PCA's own
    // presentation-deck images — forcing it onto every /presentations/list
    // record made ordinary headshot photos (Elevate speakers, etc.) render
    // as oversized squares instead of the small circular avatar everything
    // else uses.
    photoStyle: p.org_l1 === 'ProductCamp Austin' ? 'thumb' : null,
    onda_url: p.onda_url || null,
    deck_url: p.deck_url || null,
    proxy: p.proxy || null,
    status: p.status || null,
    language: null,
    country: null,
    curator: null,
  };
}

(async () => {
  try {
    // Deliberately just two sources now, not three — /api:onda-nile/sessions
    // used to be included too, but it turned out to read the exact same
    // nile_presentations table as /presentations/list underneath, just
    // through weaker normalization (it looks for old presenter/presenter_slug
    // fields that new-style rows don't set, showing "Unknown" for anything
    // current). Every live record was rendering twice because of it.
    const [staticResp, presResp] = await Promise.all([
      fetch('sessions.json'),
      fetch(PRESENTATIONS_API).catch(() => null),
    ]);
    if (!staticResp.ok) throw new Error(`sessions.json: ${staticResp.status}`);
    const staticSessions = await staticResp.json();
    // status is a real, deliberate enum (draft → submitted → pending →
    // approved → scheduled → armed → recorded → published → archived →
    // rejected) — published is genuinely the correct final state for a
    // playable talk. It used to miss 84 real PCA sessions that had been
    // bulk-imported straight to "recorded" and never moved to "published";
    // fixed at the data level (see maintenance/fix_pca_statuses), not by
    // working around it here.
    const presSessions = presResp && presResp.ok
      // visibility 'public' only — 'chapter' (station-page-only) and
      // 'private' (curator-only, seen on the Station Dashboard instead)
      // must never reach the global directory.
      ? (await presResp.json()).filter(p => p.status === 'published' && p.visibility === 'public').map(normalizePresentation)
      : [];
    allSessions = [...presSessions, ...staticSessions];

    // Build ranked tag list — every tag is ordinary, ranked by how often it appears
    const tagCount = {};
    allSessions.forEach(s => s.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
    allTags = Object.entries(tagCount).sort((a,b) => b[1]-a[1]).map(([tag,n]) => ({tag,n}));

    if (LOCKED_QUERY) document.getElementById('search-input').value = LOCKED_QUERY;
    render();
  } catch (err) {
    document.getElementById('sessions').innerHTML =
      `<div class="empty">Failed to load: ${err.message}</div>`;
  }
})();
</script>
