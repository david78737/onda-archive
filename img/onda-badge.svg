<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 70" width="235" height="70">
  <rect width="235" height="70" fill="#fff"/>
  <!-- red ellipse, vertical axis (taller than wide) — no outline, that
       was only in David's reference mockup to demonstrate the ellipse
       shape, not part of the actual design. White block arrow
       (flat-backed, not a thin triangle and not a notched chevron). -->
  <ellipse cx="38" cy="35" rx="24" ry="32" fill="#FF0000"/>
  <rect x="20" y="27" width="20" height="16" fill="#fff"/>
  <polygon points="40,20 40,50 60,35" fill="#fff"/>
  <!-- ONDA wordmark — bold black -->
  <text x="88" y="50" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="#000000">ONDA</text>
</svg>
