<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44">
  <rect width="170" height="44" fill="#fff"/>
  <!-- red play glyph — a circle with a notched chevron, not YouTube's
       rounded-square + plain triangle, same shape already used live as
       the station page's Play icon (assets/tap-arrow.png). Explicit
       width/height on the <svg> root (not just viewBox) matters here —
       without it, some browsers fall back to the SVG spec's default
       300x150 intrinsic size and stretch this into it, which is what
       turned the circle into an ellipse and blurred the render. -->
  <circle cx="28" cy="22" r="20" fill="#FF0000"/>
  <polygon points="19,10 40,22 19,34 19,27 27,22 19,17" fill="#fff"/>
  <!-- ONDA wordmark — black, per brand/trademark requirement -->
  <text x="56" y="30" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#000000">ONDA</text>
</svg>
