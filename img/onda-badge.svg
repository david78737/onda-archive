<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44">
  <rect width="170" height="44" fill="#fff"/>
  <!-- red play glyph — a vertical ellipse (taller than wide) with a
       notched chevron, deliberately not YouTube's rounded-square +
       plain triangle. Explicit width/height on the <svg> root (not just
       viewBox) matters — without it, some browsers fall back to the SVG
       spec's default 300x150 intrinsic size and stretch this into it. -->
  <ellipse cx="26" cy="22" rx="14" ry="20" fill="#FF0000"/>
  <polygon points="20,10 34,22 20,34 20,27 26,22 20,17" fill="#fff"/>
  <!-- ONDA wordmark — black, per brand/trademark requirement -->
  <text x="54" y="30" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#000000">ONDA</text>
</svg>
