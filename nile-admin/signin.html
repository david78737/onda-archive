<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contributor Sign In</title>
<style>
  :root {
    --accent:    #00C9BC;
    --accent-dim:rgba(0,201,188,.15);
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #252838;
    --ink:       #e8eaf0;
    --ink-mid:   #c8d0e8;
    --muted:     #8890b8;
    --danger:    #f07070;
    --ok:        #2ecc71;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 80px;}

  .wordmark{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;text-align:center;}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px;text-align:center;}
  .subtitle{font-size:13px;color:var(--muted);margin-bottom:36px;text-align:center;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:480px;}

  label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 13px;color:var(--ink);font-size:14px;outline:none;transition:border-color .15s;}
  input:focus{border-color:var(--accent);}

  .btn{width:100%;padding:12px;background:var(--accent);color:#0f1117;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:10px;}

  .msg{font-size:13px;min-height:20px;margin-bottom:14px;font-weight:600;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--ok);}

  /* ── Station picker ── */
  .station-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .station-card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .station-card:hover{border-color:var(--accent);background:var(--accent-dim);}
  .station-name{font-size:15px;font-weight:600;color:var(--ink);}
  .station-role{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-dim);border-radius:4px;padding:2px 8px;white-space:nowrap;}
  .station-arrow{color:var(--muted);font-size:18px;}

  .empty{text-align:center;padding:2rem;color:var(--muted);font-size:14px;}

  #style-overrides{}
</style>
<style id="skin-overrides"></style>
</head>
<body>

<div class="wordmark" id="page-wordmark">ONDA Nile</div>
<h1 id="page-title">Contributor Sign In</h1>
<div class="subtitle" id="page-subtitle">Sign in to update your tiles and manage your content.</div>

<!-- ── Step 0: Phone ── -->
<div id="step-phone" style="width:100%;max-width:480px;">
  <div class="card">
    <div class="field">
      <label>Your phone number</label>
      <input type="tel" id="auth-phone" placeholder="+1 512 555 0100" autocomplete="tel">
    </div>
    <div class="msg err" id="msg-phone"></div>
    <button class="btn" onclick="sendCode()">Send Code</button>
  </div>
</div>

<!-- ── Step 1: OTP ── -->
<div id="step-otp" style="visibility:hidden;position:absolute;pointer-events:none;width:100%;max-width:480px;">
  <div class="card">
    <div class="field">
      <label>One-time code</label>
      <input type="text" id="auth-otp" placeholder="Type your 6-digit code" maxlength="6">
    </div>
    <div class="msg err" id="msg-otp"></div>
    <button class="btn" onclick="verifyCode()">Verify</button>
    <button class="btn btn-secondary" onclick="backToPhone()">Back</button>
  </div>
</div>

<!-- ── Step 2: Station picker ── -->
<div id="step-stations" style="display:none;width:100%;max-width:480px;">
  <div style="font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center;" id="stations-intro">
    Select the station you want to work on.
  </div>
  <div class="station-list" id="station-list"></div>
</div>

<script>
const NILE_AUTH = 'https://xrxm-29on-xlyt.n7e.xano.io/api:nile';
const NILE_API  = 'https://xrxm-29on-xlyt.n7e.xano.io/api:onda-nile';

// ── Query-string config ───────────────────────────────────────────────────────
const _p = new URLSearchParams(location.search);
const SKIN       = _p.get('skin')    || null;
const LOCKED_L1  = _p.get('org_l1') || null;
const LOCKED_L2  = _p.get('org_l2') || null;
const LOCKED_L3  = _p.get('org_l3') || null;

// ── Skin definitions ──────────────────────────────────────────────────────────
const SKINS = {
  'circle-docs': {
    wordmark: 'Circle Docs',
    title:    'Contributor Sign In',
    subtitle: 'Sign in to update your Circle Docs tiles.',
    css: `
      :root {
        --accent: #008787;
        --accent-dim: rgba(0,135,135,.15);
        --bg: #EAF7F5;
        --surface: #ffffff;
        --border: #C0E8E4;
        --ink: #1A1A1A;
        --ink-mid: #444444;
        --muted: #5A7A78;
      }
      body { background: #EAF7F5; color: #1A1A1A; }
    `,
  },
};

(function applySkin() {
  const skin = SKIN && SKINS[SKIN];
  if (!skin) return;
  if (skin.wordmark) document.getElementById('page-wordmark').textContent = skin.wordmark;
  if (skin.title)    document.getElementById('page-title').textContent    = skin.title;
  if (skin.subtitle) document.getElementById('page-subtitle').textContent = skin.subtitle;
  if (skin.css)      document.getElementById('skin-overrides').textContent = skin.css;
  document.title = skin.title || document.title;
})();

// ── State ─────────────────────────────────────────────────────────────────────
let authToken = null;

function normalizePhone(raw) {
  const d = raw.replace(/\D/g, '');
  if (d.length === 10) return '+1' + d;
  if (d.length === 11 && d[0] === '1') return '+' + d;
  return '+' + d;
}

// ── Step 0 → 1 ───────────────────────────────────────────────────────────────
async function sendCode() {
  const raw = document.getElementById('auth-phone').value.trim();
  const msg = document.getElementById('msg-phone');
  msg.textContent = '';
  if (!raw) { msg.textContent = 'Enter your phone number.'; return; }
  try {
    const r = await fetch(`${NILE_AUTH}/presenter/magic/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact: normalizePhone(raw) }),
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Failed to send code'); }
    document.getElementById('step-phone').style.visibility = 'hidden';
    document.getElementById('step-phone').style.position = 'absolute';
    const otpStep = document.getElementById('step-otp');
    otpStep.style.visibility = 'visible';
    otpStep.style.position = 'relative';
    otpStep.style.pointerEvents = 'auto';
    document.getElementById('auth-otp').focus();
  } catch(e) { msg.textContent = e.message; }
}

function backToPhone() {
  document.getElementById('step-otp').style.visibility = 'hidden';
  document.getElementById('step-otp').style.position = 'absolute';
  document.getElementById('step-otp').style.pointerEvents = 'none';
  document.getElementById('step-phone').style.visibility = 'visible';
  document.getElementById('step-phone').style.position = 'relative';
  document.getElementById('msg-otp').textContent = '';
}

// ── Step 1 → 2 ───────────────────────────────────────────────────────────────
async function verifyCode() {
  const raw = document.getElementById('auth-phone').value.trim();
  const otp = document.getElementById('auth-otp').value.trim();
  const msg = document.getElementById('msg-otp');
  msg.textContent = '';
  if (otp.length < 4) { msg.textContent = 'Enter the code from your text message.'; return; }
  try {
    const r = await fetch(`${NILE_AUTH}/presenter/magic/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact: normalizePhone(raw), code: otp }),
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Invalid code'); }
    const data = await r.json();
    authToken = (data.profile_url || '').split('?token=')[1]?.split('&')[0] || null;
    if (!authToken) throw new Error('Verification failed — please try again');
    document.getElementById('step-otp').style.visibility = 'hidden';
    document.getElementById('step-otp').style.position = 'absolute';
    document.getElementById('step-otp').style.pointerEvents = 'none';
    await loadStations();
  } catch(e) { msg.textContent = e.message; }
}

// ── Step 2: Station picker ────────────────────────────────────────────────────
async function loadStations() {
  const phone = normalizePhone(document.getElementById('auth-phone').value.trim());
  document.getElementById('step-stations').style.display = 'block';
  const list = document.getElementById('station-list');
  list.innerHTML = '<div class="empty">Loading your stations…</div>';

  try {
    const r = await fetch(`${NILE_API}/nile/presenter/my-stations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, magic_auth_token: authToken }),
    });
    if (!r.ok) throw new Error('Could not load stations');
    let stations = await r.json();

    // If org params present, filter to only this curator's stations
    if (LOCKED_L1) {
      stations = stations.filter(s =>
        s.org_l1 === LOCKED_L1 &&
        s.org_l2 === LOCKED_L2 &&
        s.org_l3 === LOCKED_L3
      );
    }

    if (!stations.length) {
      list.innerHTML = '<div class="empty">No stations found for this phone number.<br>Contact your curator to be enrolled.</div>';
      return;
    }

    list.innerHTML = '';
    stations.forEach(s => {
      const card = document.createElement('div');
      card.className = 'station-card';
      card.innerHTML = `
        <div>
          <div class="station-name">${s.station_name || s.org}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${s.org_l1} · ${s.org_l2} · ${s.org_l3}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="station-role">${s.role}</span>
          <span class="station-arrow">›</span>
        </div>`;
      card.addEventListener('click', () => goToStation(s));
      list.appendChild(card);
    });
  } catch(e) {
    list.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function goToStation(station) {
  // Route to the card editor for this station
  const params = new URLSearchParams({
    org_l1: station.org_l1,
    org_l2: station.org_l2,
    org_l3: station.org_l3,
    role:   station.role,
    token:  authToken,
  });
  if (SKIN) params.set('skin', SKIN);
  window.location.href = `../nile-session-update/?${params.toString()}`;
}
</script>
</body>
</html>
